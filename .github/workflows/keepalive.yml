# GitHub disables scheduled workflows in repos with no activity for 60 days.
# This monthly no-op commit keeps the schedule alive indefinitely.
name: keepalive
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Commit keepalive timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "atmos-keepalive"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || exit 0
          git push
